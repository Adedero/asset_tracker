name: Deploy to Namecheap Node Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd ~/domains/myassetstracker
            echo "Pulling latest code..."
            git reset --hard HEAD
            git clean -fdx
            git pull origin main
            
            echo "Installing dependencies (force devDeps)..."
            source /home/***/nodevenv/domains/myassetstracker/22/bin/activate && cd /home/***/domains/myassetstracker
            rm -rf node_modules
            npm ci --include=dev
            # Alternative if npm ci still skips: npm install --production=false
            # Prisma shit
            npx prism generate
            npx prisma migrate deploy
            
            
            echo "Building app..."
            npm run build
            
            echo "Done..."
